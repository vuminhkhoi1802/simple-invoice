name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: simple_invoice_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:e2e
      - run: npm run build

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Start the full stack from zero
        run: docker compose up --build -d --wait --wait-timeout 180
      - name: Smoke test through the frontend proxy
        run: |
          curl -fsS http://localhost:8080/ | grep -q SimpleInvoice
          ASSET=$(curl -fsS http://localhost:8080/ | grep -o '/assets/[^"]*\.js' | head -1)
          test -n "$ASSET" || { echo "no /assets/*.js referenced from /"; exit 1; }
          # Helmet sets these too; /api must carry exactly one copy of each.
          for route in / "$ASSET" /api/health; do
            hdrs=$(curl -fsSI "http://localhost:8080$route")
            for h in "x-content-type-options: nosniff" "x-frame-options: DENY" "referrer-policy: strict-origin-when-cross-origin"; do
              grep -qiE "^$h[[:space:]]*$" <<<"$hdrs" || { echo "missing '$h' on $route"; exit 1; }
              [ "$(grep -ciE "^${h%%:*}:" <<<"$hdrs")" -eq 1 ] || { echo "duplicate '${h%%:*}' on $route"; exit 1; }
            done
          done
          curl -fsS http://localhost:3000/health
          TOKEN=$(curl -fsS http://localhost:8080/api/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"email":"admin@simpleinvoice.dev","password":"Password123!"}' | jq -r .accessToken)
          curl -fsS "http://localhost:8080/api/invoices?pageSize=5" -H "Authorization: Bearer $TOKEN" | jq -e '.paging.total > 20'
      - name: Logs on failure
        if: failure()
        run: docker compose logs
